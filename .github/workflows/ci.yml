name: CI Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test gate (compile, run all tests, package)
        working-directory: my-first-spring-api
        run: mvn -B clean verify

      - name: Verify build artifacts (classes and packaged jar)
        working-directory: my-first-spring-api
        run: |
          if [ ! -d target/classes ]; then echo "Build produced no classes" && exit 1; fi
          if ! ls target/*.jar >/dev/null 2>&1; then echo "Packaging produced no jar" && exit 1; fi
          echo "Build OK: classes compiled, tests passed, jar packaged"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: my-first-spring-api/e2e/package-lock.json

      - name: Ensure wrapper permissions
        run: chmod +x my-first-spring-api/mvnw

      - name: Pre-compile backend classes for E2E runner
        working-directory: my-first-spring-api
        run: ./mvnw -B -DskipTests compile

      - name: Install Playwright and browser dependencies
        working-directory: my-first-spring-api/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E and Visual QA suites
        working-directory: my-first-spring-api/e2e
        run: npm test

      - name: Upload Playwright test report on failure
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: my-first-spring-api/e2e/playwright-report/
          retention-days: 7
