# Netlify Configuration for SocioMart Frontend
# Target Backend: https://sociomart-demo.onrender.com

[build]
  # Static frontend publish directory relative to repository root
  publish = "my-first-spring-api/src/main/resources/static"
  # No build step required for static HTML/CSS/JS frontend
  command = ""

# Proxy all backend API requests to the live Render Spring Boot service
[[redirects]]
  from = "/api/*"
  to = "https://sociomart-demo.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy admin login alias endpoint
[[redirects]]
  from = "/admin/login"
  to = "https://sociomart-demo.onrender.com/admin/login"
  status = 200
  force = true

# Seller app routes (clean URLs)
[[redirects]]
  from = "/seller"
  to = "/seller.html"
  status = 200

[[redirects]]
  from = "/seller/*"
  to = "/seller.html"
  status = 200

# Buyer app routes (clean URLs)
[[redirects]]
  from = "/buyer"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/buyer/*"
  to = "/index.html"
  status = 200

# Admin app routes (clean URLs)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# Specific public clean routes for Buyer app (rewritten to index.html)
# These preserve clean URLs without a catch-all SPA redirect that would break seller.html/admin.html
[[redirects]]
  from = "/food"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kitchens"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/kitchen/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/homemade"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/homemade/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/homemade-store/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/offering/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/product/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/category/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/search/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/favourites"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/orders"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/order/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/summary"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/confirm"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/payment"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/payment-success"
  to = "/index.html"
  status = 200

# Security and caching headers for frontend assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400, must-revalidate"
