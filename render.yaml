# Render Blueprint — SocioMart persistent free deployment
# Deploy: push this repo to GitHub, then on render.com → New → Blueprint →
# select this repository. Render builds the Docker image and serves the app.
# Free tier: the service sleeps after ~15 min without traffic; the first
# request after a sleep takes ~60-90s to wake (cold start).
#
# NOTE: Render auto-injects the PORT environment variable at runtime.
# The app binds to ${PORT:8081} (see application.properties), so we do NOT
# hard-code PORT here — letting Render control it avoids routing mismatches.

services:
  - type: web
    name: sociomart-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/kitchens
    # Deployment gate: Render must NOT react to pushes to main on its own.
    # GitHub Actions (workflow "CI Build Verification", job "build") is the
    # authoritative gate - it runs the full Maven test suite via
    # "mvn -B clean verify". With autoDeploy enabled, Render deployed every
    # pushed commit regardless of that result, so a failing test could still
    # reach production. Disabled so a deploy is an explicit action taken
    # AFTER CI has passed, not a side effect of a push.
    #
    # NOTE: changing this file does not alter the currently running
    # deployment; it only governs future deploys.
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
