spring.application.name=SocioMart

# PORT is injected by cloud platforms; falls back to 8081 locally
server.port=${PORT:8081}

logging.level.com.example.my_first_spring_api=INFO

# In-memory database (no file locks; fresh schema on each boot via ddl-auto=update)
spring.datasource.url=jdbc:h2:mem:sociomartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
