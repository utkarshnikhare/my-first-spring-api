spring.application.name=SocioMart

# PORT is injected by cloud platforms; falls back to 8081 locally.
# server.address is explicit so the container listens on all interfaces
# (Render's port scanner must reach it from outside the container).
server.address=0.0.0.0
server.port=${PORT:8081}

# ---- Safe defaults: every profile inherits these unless it overrides them ----
logging.level.com.example.my_first_spring_api=INFO

# The schema is owned by Flyway migrations (db/migration). Hibernate must never
# create, alter or drop tables outside the local developer profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Developer tools are OFF unless the local profile turns them on.
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Password (mobile + password) login for buyer, seller, admin and super admin.
# On by default everywhere; the admin passwords come only from the environment.
sociomart.auth.password-login-enabled=true
sociomart.auth.admin-password=${SOCIOMART_ADMIN_PASSWORD:${SOCIOMART_DEMO_ADMIN_PASSWORD:}}
sociomart.auth.super-admin-password=${SOCIOMART_SUPER_ADMIN_PASSWORD:${SOCIOMART_DEMO_SUPER_ADMIN_PASSWORD:}}

# Bootstrap (built-in admin accounts, feature flags, pilot area) is idempotent:
# it only ADDS missing rows and never overwrites existing data. Tests disable it.
sociomart.bootstrap.enabled=true
sociomart.bootstrap.super-admin-mobile=9000000001
sociomart.bootstrap.admin-mobile=9000000002

# Login/registration rate limiting (in-process, bounded; see AuthRateLimiter).
# 5 failed logins within 15 minutes (per mobile and per IP) trigger a 15-minute
# lock (HTTP 429); 5 registrations per IP per 15 minutes are allowed. Turned off
# only for the fast "test" profile.
sociomart.ratelimit.enabled=true

# Full public link for a kitchen page, e.g. https://my-shop.onrender.com
# Used only to build shareable URLs; defaults to relative links when unset.
sociomart.public-base-url=${PUBLIC_BASE_URL:}

# Session cookie/timeout. The timeout below is inherited by Spring Session
# (spring.session.timeout falls back to server.servlet.session.timeout). The
# cookie FLAGS are enforced by the SessionConfig bean, because Spring Session
# writes the session cookie itself instead of the servlet container.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Finish in-flight requests on SIGTERM (Render redeploy / sleep) before stopping
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
