# SocioMart - Demo Profile Configuration
# Activate with: spring.profiles.active=demo
# This profile seeds the in-memory database with demo data for testing/development.
#
# IMPORTANT: the datasource is NOT overridden here - we intentionally inherit the
# in-memory H2 URL from application.properties (jdbc:h2:mem:sociomartdb). This keeps
# Render deploys dependency-free (no filesystem/lock files, no ./data directory
# requirement) and guarantees a fresh, consistent demo seed on every boot.

spring.application.name=SocioMart (Demo)

# SQL initialization - schema auto-created by Hibernate; demo data seeded by DemoDataSeeder
spring.jpa.defer-datasource-initialization=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Session
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Logging
logging.level.com.example.my_first_spring_api=DEBUG
