# SocioMart - Demo Profile Configuration
# Activate with: spring.profiles.active=demo
# This profile seeds the database with demo data for testing/development.

spring.application.name=SocioMart (Demo)

# Inherit base database config
spring.datasource.url=jdbc:h2:file:./data/sociomartdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL initialization - run data.sql on startup (schema auto-created by Hibernate)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Session
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Logging
logging.level.com.example.my_first_spring_api=DEBUG
