# SocioMart - Production Profile Configuration
# Activate with: spring.profiles.active=prod
# This profile skips demo data seeding for clean production deployments.

spring.application.name=SocioMart (Production)

# Database - use production database (e.g., PostgreSQL, MySQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/sociomart
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# For now, keep H2 but disable demo seeding
spring.datasource.url=jdbc:h2:file:./data/sociomartdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# Disable SQL initialization - no demo data in production
spring.sql.init.mode=never

# Swagger - disable in production or restrict access
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Session
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# Logging - minimal in production
logging.level.com.example.my_first_spring_api=WARN
