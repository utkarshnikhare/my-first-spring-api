# Production (Render + Supabase PostgreSQL). Run with SPRING_PROFILES_ACTIVE=prod.
# Flyway owns the schema; Hibernate only validates. All secrets come from the
# environment - nothing credential-like is stored here.
spring.application.name=SocioMart (Production)

# ---- Startup slimming (Render free-tier health-check deadline) ----
# Render kills the instance if /api/health is not answering quickly enough, which
# produces a permanent restart loop. Two settings cut boot time materially:
#   - banner-mode=off: drop the startup banner (tiny, but free).
#   - lazy-initialization=true: create beans on first use instead of all at boot.
#     /api/health has no heavy dependencies, so Render sees the service healthy early.
#     The fail-fast credential guard (ProductionStartupValidator) is deliberately NOT
#     deferred - it is excluded via StartupLazyInitConfig - and the ApplicationRunners
#     (ProductionBootstrap, KitchenSlugBackfillRunner) are always invoked at boot, so a
#     misconfiguration still fails fast and DB bootstrap still runs, instead of both
#     silently surfacing on the first request.
spring.main.banner-mode=off
spring.main.lazy-initialization=true

spring.datasource.url=${SOCIOMART_DB_JDBC_URL}
spring.datasource.username=${SOCIOMART_DB_USERNAME}
spring.datasource.password=${SOCIOMART_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Session-mode pooler (port 5432) supports prepared statements as-is. If the
# transaction pooler (6543) is ever used, append prepareThreshold=0 to the URL.
# With JDBC metadata access disabled below, Hibernate must use the explicit
#PostgreSQL dialect to identify the database at startup.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hikari tuned for a small free-tier pooled database (keep-alive, fast timeout, pre-warmed)
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# Flyway owns the schema and must finish before Hibernate validates the JPA
# mappings. StartupLazyInitConfig keeps Flyway and its migration initializer
# eager even though the rest of the production context uses lazy initialization.
# Pin the production schema contract here so shared-default changes cannot
# silently disable migrations or Hibernate validation on Render.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Skip JDBC metadata introspection for default table/column definitions.
# Prevents slow schema-metadata probes during boot. With the dialect explicitly
# set above, JDBC metadata access stays disabled to keep startup fast and avoid
# HHH90000021.
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Hibernate Query Batching (eliminates N+1 query latency)
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Phase E: sessions are stored in PostgreSQL (Spring Session JDBC, V4 Flyway
# migration owns the SPRING_SESSION* tables). The initializer must stay off
# here; it is only meant for embedded (H2) databases.
spring.session.jdbc.initialize-schema=never

logging.level.com.example.my_first_spring_api=INFO
logging.structured.format.console=logstash
