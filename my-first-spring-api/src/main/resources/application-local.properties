# Local development only (developers' machines). Run with: -Dspring-boot.run.profiles=local
# In-memory H2, schema created by Hibernate on every start; the H2 console and Swagger are available.
# Admin login works only if SOCIOMART_ADMIN_PASSWORD / SOCIOMART_SUPER_ADMIN_PASSWORD are set.

spring.application.name=SocioMart (Local)

spring.datasource.url=jdbc:h2:mem:sociomartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Allow session cookies on HTTP (localhost) for local development and testing.
# WebKit blocks Secure cookies on HTTP; Chrome/Firefox allow them on localhost.
server.servlet.session.cookie.secure=false

logging.level.com.example.my_first_spring_api=DEBUG
