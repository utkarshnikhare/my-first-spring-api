spring.application.name=SocioMart (Persistent Demo)

server.port=${PORT:8081}

spring.datasource.url=${SOCIOMART_DB_JDBC_URL}
spring.datasource.username=${SOCIOMART_DB_USERNAME}
spring.datasource.password=${SOCIOMART_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=false

# Hikari tuned for a small free-tier pooled database (few connections, fail fast, survive idle drops)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000

server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

logging.level.com.example.my_first_spring_api=INFO
