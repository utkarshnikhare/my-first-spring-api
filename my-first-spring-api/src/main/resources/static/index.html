<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SocioMart — your hyper-local community marketplace. Discover. Connect.">
    <meta name="theme-color" content="#2E1065">
    <title>SocioMart — Discover. Connect.</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232E1065'/><text x='50' y='68' font-size='52' text-anchor='middle'>🏪</text></svg>">
    <link rel="stylesheet" href="/css/styles.css?v=12">
</head>
<body>
    <!-- Fixed persistent bottom navigation (Spec 1.3) -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
        <a href="#/home" data-nav="home" class="nav-item">
            <span class="nav-icon" aria-hidden="true">🏠</span>
            <span class="nav-label">Home</span>
        </a>
        <a href="#/favourites" data-nav="favourites" class="nav-item">
            <span class="nav-icon" aria-hidden="true">❤️</span>
            <span class="nav-label">Favourites</span>
        </a>
        <a href="#/orders" data-nav="orders" class="nav-item">
            <span class="nav-icon" aria-hidden="true">📋</span>
            <span class="nav-label">Orders &amp; Enquiries</span>
        </a>
        <a href="#/profile" data-nav="profile" class="nav-item">
            <span class="nav-icon" aria-hidden="true">👤</span>
            <span class="nav-label">Profile</span>
        </a>
    </nav>

    <!-- Sticky bottom cart bar (Screen 4) -->
    <a href="#/summary" class="view-order-bar" id="viewOrderBar" hidden>
        <span class="vob-icon" aria-hidden="true">🛒</span>
        <span class="vob-text"><strong id="vobCount">0</strong> items · <strong id="vobTotal">₹0</strong></span>
        <span class="vob-cta">View Order →</span>
    </a>

    <main id="view" class="view" aria-live="polite">
        <div class="page-loading">
            <div class="spinner" role="status" aria-label="Loading"></div>
        </div>
    </main>

    <div id="modalRoot" class="modal-root" hidden></div>
    <div id="sheetRoot" class="sheet-root" hidden></div>
    <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

    <script src="/js/config.js"></script>
    <script src="/js/common.js?v=2"></script>
    <script src="/js/buyer.js?v=2"></script>
    <script src="/js/app.js?v=2"></script>
</body>
</html>
