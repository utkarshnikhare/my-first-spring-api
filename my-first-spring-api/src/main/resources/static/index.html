<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SocioMart — your hyper-local community marketplace. Discover fresh homemade food, artisan goods, and neighborhood kitchens.">
    <meta name="theme-color" content="#293B50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SocioMart">
    <title>SocioMart — Discover. Connect.</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Netlify Badge & Overlay Neutralizer: Prevents floating badge from intercepting mobile touch events -->
    <script>
        (function () {
            function seedMarkers() {
                ['nl-badge-frame', 'nl-hud-frame'].forEach(function(id) {
                    if (!document.getElementById(id)) {
                        var el = document.createElement('div');
                        el.id = id;
                        el.setAttribute('aria-hidden', 'true');
                        el.style.cssText = 'display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important;top:-9999px!important;z-index:-99999!important;';
                        if (document.documentElement) document.documentElement.appendChild(el);
                    }
                });
            }
            seedMarkers();
            if (window.MutationObserver) {
                var observer = new MutationObserver(function () {
                    var badges = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify" i], iframe[src*="netlify" i], [class*="netlify-badge" i]');
                    for (var i = 0; i < badges.length; i++) {
                        var node = badges[i];
                        if (node.tagName === 'IFRAME') {
                            node.remove();
                        }
                    }
                });
                observer.observe(document.documentElement, { childList: true, subtree: true });
            }
        })();
    </script>
    <!-- Apply the saved theme before first paint to avoid a light-mode flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('sociomart-theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css?v=21">
    <!-- Immediate cloud server warmup ping: wakes Render backend if sleeping -->
    <script>fetch('/api/health', { method: 'GET', cache: 'no-store' }).catch(function(){});</script>
</head>
<body>
    <!-- Netlify Badge Neutralizer DOM markers: If hud.js runs, it sees these and exits immediately -->
    <div id="nl-badge-frame" style="display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important;top:-9999px!important;z-index:-99999!important;" aria-hidden="true"></div>
    <div id="nl-hud-frame" style="display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important;top:-9999px!important;z-index:-99999!important;" aria-hidden="true"></div>

    <!-- Fixed persistent bottom navigation (Spec 1.3) -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
        <a href="#/home" data-nav="home" class="nav-item">
            <span class="nav-icon" aria-hidden="true">🏠</span>
            <span class="nav-label">Home</span>
        </a>
        <a href="#/favourites" data-nav="favourites" class="nav-item">
            <span class="nav-icon" aria-hidden="true">❤️</span>
            <span class="nav-label">Favourites</span>
        </a>
        <a href="#/orders" data-nav="orders" class="nav-item">
            <span class="nav-icon" aria-hidden="true">📋</span>
            <span class="nav-label">Orders &amp; Enquiries</span>
        </a>
        <a href="#/profile" data-nav="profile" class="nav-item">
            <span class="nav-icon" aria-hidden="true">👤</span>
            <span class="nav-label">Profile</span>
        </a>
    </nav>

    <!-- Sticky bottom cart bar (Screen 4) -->
    <a href="#/summary" class="view-order-bar" id="viewOrderBar" hidden>
        <span class="vob-icon" aria-hidden="true">🛒</span>
        <span class="vob-text"><strong id="vobCount">0</strong> <span id="vobItemWord">items</span> · <strong id="vobTotal">₹0</strong></span>
        <span class="vob-cta">Place Order →</span>
    </a>

    <main id="view" class="view" aria-live="polite">
        <div class="page-loading">
            <div class="spinner" role="status" aria-label="Loading"></div>
        </div>
    </main>

    <div id="modalRoot" class="modal-root" hidden></div>
    <div id="sheetRoot" class="sheet-root" hidden></div>
    <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

    <script src="/js/config.js"></script>
    <script src="/js/common.js?v=14"></script>
    <script src="/js/buyer.js?v=14"></script>
    <script src="/js/app.js?v=9"></script>
</body>
</html>
