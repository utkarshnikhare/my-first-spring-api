<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SocioMart Seller — manage your kitchen, offerings, and orders.">
    <meta name="theme-color" content="#293B50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SocioMart Seller">
    <title>SocioMart Seller Portal</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Apply the saved theme before first paint to avoid a light-mode flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('sociomart-theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css?v=17">
    <link rel="stylesheet" href="/css/seller.css?v=3.0">
</head>
<body>
    <!-- Seller App: 5-tab persistent bottom navigation -->
    <nav class="bottom-nav seller-nav" id="bottomNav" aria-label="Seller navigation" style="display: none">
        <a href="#/home" data-nav="home" class="nav-item active">
            <span class="nav-icon" aria-hidden="true">🏠</span>
            <span class="nav-label">Home</span>
        </a>
        <!-- Label follows the approved design ("Store"); the existing #/kitchen
             route and data-nav="kitchen" are unchanged. -->
        <a href="#/kitchen" data-nav="kitchen" class="nav-item">
            <span class="nav-icon" aria-hidden="true">🏪</span>
            <span class="nav-label">Store</span>
        </a>
        <a href="#/orders" data-nav="orders" class="nav-item">
            <span class="nav-icon" aria-hidden="true">📋</span>
            <span class="nav-label">Orders</span>
        </a>
        <!-- Label renamed to "My Offerings"; the #/history route is kept working as an alias. -->
        <a href="#/my-offerings" data-nav="history" class="nav-item">
            <span class="nav-icon" aria-hidden="true">🍽️</span>
            <span class="nav-label">My Offerings</span>
        </a>
        <!-- Recurring offerings: direct entry to the RECURRING list (create/edit/pause/end). -->
        <a href="#/recurring" data-nav="recurring" class="nav-item">
            <span class="nav-icon" aria-hidden="true">🔁</span>
            <span class="nav-label">Recurring</span>
        </a>
        <a href="#/earnings" data-nav="earnings" class="nav-item">
            <span class="nav-icon" aria-hidden="true">💰</span>
            <span class="nav-label">Earnings</span>
        </a>
        <a href="/index.html" class="nav-item nav-item-portal" title="Return to Buyer Marketplace">
            <span class="nav-icon" aria-hidden="true">🛒</span>
            <span class="nav-label">Buyer View</span>
        </a>
    </nav>

    <main id="view" class="view seller-view" aria-live="polite">
        <div class="page-loading">
            <div class="spinner" role="status" aria-label="Loading"></div>
        </div>
    </main>

    <div id="modalRoot" class="modal-root" hidden></div>
    <div id="sheetRoot" class="sheet-root" hidden></div>
    <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

    <script src="/js/config.js"></script>
    <script src="/js/common.js?v=9"></script>
    <script src="/js/seller.js?v=3.0"></script>
</body>
</html>
