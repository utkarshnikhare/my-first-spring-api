<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="SocioMart Admin — Approvals, seller registry, analytics, platform console.">
    <meta name="theme-color" content="#293B50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SocioMart Admin">
    <title>SocioMart Admin</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Netlify Badge & Overlay Neutralizer: Prevents floating badge from intercepting mobile touch events -->
    <script>
        (function () {
            function seedMarkers() {
                ['nl-badge-frame', 'nl-hud-frame'].forEach(function(id) {
                    if (!document.getElementById(id)) {
                        var el = document.createElement('div');
                        el.id = id;
                        el.setAttribute('aria-hidden', 'true');
                        el.style.cssText = 'display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important;top:-9999px!important;z-index:-99999!important;';
                        if (document.documentElement) document.documentElement.appendChild(el);
                    }
                });
            }
            seedMarkers();
            if (window.MutationObserver) {
                var observer = new MutationObserver(function () {
                    var badges = document.querySelectorAll('#nl-badge-frame, #nl-hud-frame, iframe[title*="Netlify" i], iframe[src*="netlify" i], [class*="netlify-badge" i]');
                    for (var i = 0; i < badges.length; i++) {
                        var node = badges[i];
                        if (node.tagName === 'IFRAME') {
                            node.remove();
                        }
                    }
                });
                observer.observe(document.documentElement, { childList: true, subtree: true });
            }
        })();
    </script>
    <!-- Apply the saved theme before first paint to avoid a light-mode flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('sociomart-theme');
                if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/styles.css?v=20">
    <link rel="stylesheet" href="/css/admin.css?v=13">
</head>
<body class="admin-body">
    <!-- Netlify Badge Neutralizer DOM markers: If hud.js runs, it sees these and exits immediately -->
    <div id="nl-badge-frame" style="display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important;top:-9999px!important;z-index:-99999!important;" aria-hidden="true"></div>
    <div id="nl-hud-frame" style="display:none!important;visibility:hidden!important;pointer-events:none!important;width:0!important;height:0!important;position:absolute!important;left:-9999px!important;top:-9999px!important;z-index:-99999!important;" aria-hidden="true"></div>

    <!-- Admin top bar -->
    <header class="admin-topbar hidden" id="adminTopbar">
        <div class="admin-brand">🛡️ SocioMart <span>Admin</span></div>
        <div class="admin-identity">
            <span class="admin-role-badge" id="adminRoleBadge">ADMIN</span>
            <span class="admin-identity-name" id="adminName">—</span>
            <button class="icon-btn" type="button" data-action="toggle-theme" aria-label="Toggle theme">🌓</button>
            <button class="icon-btn" type="button" data-action="logout" title="Logout" aria-label="Logout">⏻</button>
        </div>
    </header>

    <!--
        Admin V1 primary navigation.

        Exactly the eight approved operational sections. Kitchens, Items/Offerings,
        Enquiries, Diagnose, Health and Console are deliberately NOT here:
        Diagnose / Health / Console are developer diagnostics, and the others are
        reachable through the Sellers, Buyers and Orders screens that actually
        need them. Their backend endpoints are untouched - only the product
        navigation was simplified.
    -->
    <nav class="bottom-nav admin-nav hidden" id="adminNav" aria-label="Admin navigation">
        <a href="#/dashboard" data-nav="dashboard" class="nav-item active">
            <span class="nav-icon" aria-hidden="true">&#127968;</span>
            <span class="nav-label">Dashboard</span>
        </a>
        <a href="#/approvals" data-nav="approvals" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&#9203;</span>
            <span class="nav-label">Approvals</span>
        </a>
        <a href="#/sellers" data-nav="sellers" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&#128101;</span>
            <span class="nav-label">Sellers</span>
        </a>
        <a href="#/buyers" data-nav="buyers" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&#128100;</span>
            <span class="nav-label">Buyers</span>
        </a>
        <a href="#/orders" data-nav="orders" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&#128230;</span>
            <span class="nav-label">Orders</span>
        </a>
        <a href="#/analytics" data-nav="analytics" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&#128202;</span>
            <span class="nav-label">Analytics</span>
        </a>
        <a href="#/locations" data-nav="locations" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&#127961;</span>
            <span class="nav-label">Areas &amp; Societies</span>
        </a>
        <a href="#/exports" data-nav="exports" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&#128229;</span>
            <span class="nav-label">Exports</span>
        </a>
    </nav>

    <main id="view" class="view admin-view" aria-live="polite">
        <div class="page-loading">
            <div class="spinner" role="status" aria-label="Loading"></div>
        </div>
    </main>

    <div id="modalRoot" class="modal-root" hidden></div>
    <div id="sheetRoot" class="sheet-root" hidden></div>
    <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

    <script src="/js/config.js"></script>
    <script src="/js/common.js?v=12"></script>
    <script src="/js/admin.js?v=13"></script>
</body>
</html>
