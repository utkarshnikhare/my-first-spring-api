# Defaults for the automated tests (profile "test"): in-memory H2 and no start-up bootstrap,
# so every test class starts from an empty database. Individual tests override any of this.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
sociomart.bootstrap.enabled=false
